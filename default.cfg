# Galaxy Wake Master Configuration
# Managed via Web UI (http://127.0.0.1:8096) or editing /data/adb/galaxy_wake_master.cfg
# Author: hoc

# Volume Wake Controls (Power Button Replacement)
VOL_UP_WAKE=1
VOL_DOWN_WAKE=1
DROP_VOL_ON_WAKE=1
HEADSET_HOOK_WAKE=0

# Put Down to Sleep (Wake-Down Controls)
PUT_DOWN_SLEEP=1
FACE_DOWN_SLEEP=1
POCKET_SLEEP=1
FLAT_TABLE_SLEEP=0
SLEEP_DELAY=2

# Hardware / Kernel Controls
HW_SYSFS_WAKE=1
VIBRATE_FEEDBACK=1
WEB_PORT=8096
